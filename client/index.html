<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="Huy Phong Wine HRM — quản trị nhân sự và vận hành xuất khẩu rượu vang." />

    <!-- PWA: cài lên màn hình chính như một ứng dụng -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Huy Phong Wine" />
    <!-- Favicon nội tuyến: chữ H trắng trên nền chàm, trùng bộ icon PWA -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M20 16h6v13h12V16h6v32h-6V35H26v13h-6z' fill='white'/%3E%3C/svg%3E"
    />
    <title>Huy Phong Wine HRM</title>

    <!--
      Mở kết nối tới Google Fonts ngay từ đầu. Trước đây font được nạp bằng
      @import trong index.css — trình duyệt chỉ biết tới nó SAU khi tải và phân
      tích xong CSS, nên chữ hiện muộn hơn hẳn. Preconnect + preload rút ngắn
      chuỗi phụ thuộc đó.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    />

    <meta property="og:title" content="HRM Huy Phong" />
    <meta property="og:description" content="Quản lý dự án, giao việc, chấm công, bảng công và tính lương." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
